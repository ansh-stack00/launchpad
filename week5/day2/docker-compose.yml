services:
  client:
    build: ./client
    ports:
      - "3000:3000"
    depends_on:
      - server

  server:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      MONGO_URL: mongodb://mongo:27017/feedback
    depends_on:
      - mongo
    

  mongo:
    image: mongo:5  
    volumes:
      - mongo_data:/data/db
   
volumes:
  mongo_data:
