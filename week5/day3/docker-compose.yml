
services:
  backend-service-1:
    build: ./backend
    container_name: backend-service-1
    

  backend-service-2:
    build: ./backend
    container_name: backend-service-2


  nginx:
    image: nginx:latest
    container_name: nginx-reverse-proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-service-1
      - backend-service-2
