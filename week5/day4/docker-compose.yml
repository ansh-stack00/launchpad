version: "3.8"

services:
  app:
    image: node:18
    working_dir: /usr/src/app
    volumes:
      - ./app:/usr/src/app
    command: ["node", "server.js"]

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - app
